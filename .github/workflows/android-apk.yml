# Construiește aplicația Android (APK) și o publică în release-ul „android”.
# Pe telefon se descarcă de la: releases/download/android/TuneBox.apk
name: Aplicație Android (APK)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Pregătește fișierele
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk out/TuneBox.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/TuneBox-32bit.apk
          ls -la out
          # version.json: aplicația îl citește ca să afle dacă există o versiune nouă
          jq -n \
            --argjson code "${{ github.run_number }}" \
            --arg name "1.0.${{ github.run_number }}" \
            --rawfile notes android/whatsnew.txt \
            --arg apk "https://github.com/${{ github.repository }}/releases/download/android/TuneBox.apk" \
            --arg apk32 "https://github.com/${{ github.repository }}/releases/download/android/TuneBox-32bit.apk" \
            '{versionCode: $code, versionName: $name, notes: ($notes | rtrimstr("\n")), apk: $apk, apk32: $apk32}' \
            > out/version.json
          cat out/version.json

      - name: Publică în release-ul „android”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "TuneBox pentru Android (APK)" --notes "$(cat <<'NOTES'
          **Descarcă și instalează pe telefon:**

          - **[TuneBox.apk](https://github.com/gergelydez/TuneBox/releases/download/android/TuneBox.apk)** — pentru aproape toate telefoanele (din 2017 încoace)
          - [TuneBox-32bit.apk](https://github.com/gergelydez/TuneBox/releases/download/android/TuneBox-32bit.apk) — doar pentru telefoane foarte vechi, dacă primul nu se instalează

          La instalare, Android îți cere să permiți instalarea din browser („surse necunoscute”). Se actualizează automat la fiecare modificare a aplicației.
          NOTES
          )"
          fi
          # întâi APK-urile, apoi version.json (ca aplicația să nu vadă versiunea înainte să existe APK-ul)
          gh release upload android out/TuneBox.apk out/TuneBox-32bit.apk --clobber
          gh release upload android out/version.json --clobber
